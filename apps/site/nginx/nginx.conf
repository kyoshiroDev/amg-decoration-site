# BROUILLON CRM 2 (plan devops, non committé). Site statique servi par nginx non root (UID 101),
# derrière le Traefik existant (TLS, HTTP → HTTPS). Reproduit vercel.json : redirections 308 sans
# chaîne (ADR-0008, `permanent: true` = 308 chez Vercel), barre finale, www → domaine nu, en-têtes
# de sécurité et de cache. Conformité vérifiée par `npm run test:conformance -w @amg/site`.
# Système de fichiers en lecture seule : seul /tmp (tmpfs) est inscriptible.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout combined;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Derrière Traefik, le port interne (8080) et le schéma http ne doivent jamais fuir dans un Location.
  absolute_redirect off;

  charset utf-8;
  charset_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  # Fichiers précompressés au build (.gz) ; repli dynamique pour le reste.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  # Table générée depuis vercel.json (apps/site/scripts/nginx-redirects.ts).
  include /etc/nginx/amg/redirects.conf;

  # www.amgdecorationdinterieur.com : chaque redirection pointe directement vers le domaine nu.
  map $host $amg_origin {
    default "";
    www.amgdecorationdinterieur.com https://amgdecorationdinterieur.com;
  }

  # Cache long des fichiers fingerprintés (vercel.json « headers »). Le reste (HTML, robots.txt…)
  # reprend la valeur par défaut de Vercel : sans Cache-Control, un navigateur pourrait garder une
  # page en cache heuristique et réclamer, après un déploiement, des /_astro/ supprimés.
  map $uri $amg_cache_control {
    default "public, max-age=0, must-revalidate";
    "~^/_astro/" "public, max-age=31536000, immutable";
    "~^/icons\..+\.svg$" "public, max-age=31536000, immutable";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # En-têtes au niveau serveur uniquement : un add_header dans une location les annulerait tous.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Cache-Control $amg_cache_control always;

    # Sonde de santé (HEALTHCHECK de l'image), jamais routée publiquement de façon utile.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Règles de réécriture dans la location (seuls `return` y sont utilisés : usage sûr de `if`).
    location / {
      # 1. Anciennes URL (WordPress) → nouvelles, sans chaîne (paramètres conservés, ex. UTM).
      if ($amg_redirect) {
        return 308 $amg_origin$amg_redirect$is_args$args;
      }
      # 2. Barre finale (règle /:path(...) de vercel.json). Capture depuis $request_uri (brut, encodé) :
      #    jamais $uri, décodé, qui permettrait d'injecter un saut de ligne dans l'en-tête Location.
      #    Paramètres via $is_args$args, comme Vercel : un `?` vide n'est pas recopié.
      if ($request_uri ~ "^(/(?!(?:\.well-known|_vercel)/)(?:[^/?]+/)*[^/.?]+)(?:\?.*)?$") {
        return 308 $amg_origin$1/$is_args$args;
      }
      # 3. www → domaine nu pour tout le reste.
      if ($amg_origin) {
        return 308 $amg_origin$request_uri;
      }
      try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
  }
}
