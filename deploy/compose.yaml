# Un seul fichier, deux projets Compose isolés sur le VPS (ADR-0020) :
#   production    : docker compose -p amg-prod    --env-file /opt/amg/prod/amg.env    -f compose.yaml up -d
#   préproduction : docker compose -p amg-staging --env-file /opt/amg/staging/amg.env -f compose.yaml -f compose.staging.yaml up -d
# Installé sur le serveur par l'humain après relecture du diff (docs/EXPLOITATION.md, 3.3), jamais
# envoyé par la CI : la clé de déploiement ne peut que choisir un digest d'image.
# Images épinglées par digest (relevé avec `docker buildx imagetools inspect <image:tag>`) ; le site
# et l'API par le digest publié par la CI (SITE_DIGEST, API_DIGEST, écrits par deploy.sh).
# Chaque projet a ses volumes, son réseau de données interne et son réseau d'entrée vers Traefik.
# Jamais de `ports:` (seul Traefik expose), jamais de `container_name` (déploiement par réplique).
# Ressources : limites dures (mémoire sans swap), priorité CPU basse, tués en premier en cas d'OOM
# de l'hôte : le projet voisin ne doit jamais manquer de ressources.
# Plafond commun imposé par le noyau : chaque conteneur est dans la slice de son environnement,
# amg-prod.slice ou amg-staging.slice, toutes deux enfants de amg.slice (deploy/systemd/ : 3 800 Mio
# pour tout AMG, 1 Gio pour la préproduction). Budget contrôlé en CI par deploy/ci/check-budget.sh :
# chaque service DOIT avoir cgroup_parent: amg-<env>.slice, mem_limit = memswap_limit, au plus une
# réplique, et en préproduction oom_score_adj: 900 (EXPLOITATION.md, 10).

name: ${AMG_PROJECT:?AMG_PROJECT manquant}

x-hardening: &hardening
  restart: unless-stopped
  # Pilote cgroup systemd : la valeur est un nom de slice ; préfixe `amg-` littéral, donc toujours
  # sous amg.slice (scope amg.slice/amg-<env>.slice/docker-<id>.scope).
  cgroup_parent: amg-${AMG_ENV:?AMG_ENV manquant}.slice
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cpu_shares: 512
  # Tués avant le voisin en cas de manque de mémoire de l'hôte ; dans la slice, la préproduction
  # (900, compose.staging.yaml) part d'abord, la base de production (200) en dernier.
  oom_score_adj: 500
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  site:
    <<: *hardening
    image: ${SITE_IMAGE:?SITE_IMAGE manquant}@${SITE_DIGEST:?SITE_DIGEST manquant}
    profiles: [site]
    # Non root imposé, quelle que soit l'image (UID de nginx-unprivileged).
    user: '101:101'
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    mem_limit: ${SITE_MEM_LIMIT:-64m}
    memswap_limit: ${SITE_MEM_LIMIT:-64m}
    cpus: 0.5
    pids_limit: 64
    networks:
      - edge
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=${AMG_EDGE_NETWORK}'
      - 'traefik.http.routers.${AMG_PROJECT}-site.rule=${SITE_RULE:?SITE_RULE manquant}'
      - 'traefik.http.routers.${AMG_PROJECT}-site.entrypoints=websecure'
      - 'traefik.http.routers.${AMG_PROJECT}-site.tls.certresolver=${AMG_CERTRESOLVER:?AMG_CERTRESOLVER manquant}'
      - 'traefik.http.routers.${AMG_PROJECT}-site.middlewares=${SITE_MIDDLEWARES:?SITE_MIDDLEWARES manquant}'
      - 'traefik.http.services.${AMG_PROJECT}-site.loadbalancer.server.port=8080'
      # Rejoue une requête sur l'autre réplique si un conteneur s'arrête pendant une bascule.
      # Noms préfixés par le projet : la production et la préproduction ne partagent aucun objet Traefik.
      - 'traefik.http.middlewares.${AMG_PROJECT}-retry.retry.attempts=3'
      - 'traefik.http.middlewares.${AMG_PROJECT}-retry.retry.initialinterval=100ms'

  postgres:
    <<: *hardening
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    # L'entrypoint officiel a besoin de ces droits pour préparer PGDATA puis passer à l'utilisateur postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: amg
      POSTGRES_DB: amg
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-256MB}
    volumes:
      - pgdata:/var/lib/postgresql
    # Taille explicite : un tmpfs est de la mémoire comptée dans la limite du conteneur.
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=1m,mode=1777
    shm_size: 128mb
    oom_score_adj: 200
    mem_limit: ${PG_MEM_LIMIT:-512m}
    memswap_limit: ${PG_MEM_LIMIT:-512m}
    cpus: 1.0
    pids_limit: 200
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amg -d amg -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *hardening
    image: redis:8.12.0-alpine3.23@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    # Le shell (root, sans autre capacité que celles-ci) lit le secret, puis lâche ses privilèges :
    # Redis lit sa configuration sur l'entrée standard. Aucun secret dans la ligne de commande
    # (visible par `ps` sur l'hôte), et l'entrypoint officiel ne modifie pas le propriétaire du
    # fichier monté depuis l'hôte. Modèle du fichier : deploy/env/redis.conf.example (utilisateurs
    # ACL : default désactivé, amg_api limité au préfixe de l'environnement ; sans persistance).
    # Un Redis par environnement : l'ACL de chacun ne couvre que son préfixe amg:<env>:.
    cap_add: [SETGID, SETUID, DAC_OVERRIDE]
    entrypoint:
      - /bin/sh
      - -c
      - exec /bin/setpriv --reuid redis --regid redis --clear-groups redis-server - < /run/secrets/redis_conf
    secrets:
      - redis_conf
    volumes:
      - redisdata:/data
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    memswap_limit: ${REDIS_MEM_LIMIT:-128m}
    cpus: 0.25
    pids_limit: 64
    networks:
      - data
    healthcheck:
      # Sans authentification (utilisateur default désactivé) : un PING renvoie NOAUTH, preuve que le
      # serveur répond ; aucun mot de passe dans la sonde.
      test: ['CMD-SHELL', 'redis-cli -h 127.0.0.1 ping 2>&1 | grep -qE "PONG|NOAUTH"']
      interval: 10s
      timeout: 3s
      retries: 5

  # API (ADR-0023) : servie sous /api/ des hôtes admin. et espace. (même origine que chaque CRM).
  # Migrations appliquées AVANT la bascule par deploy.sh (conteneur ponctuel, rôle amg_migrator),
  # jamais au démarrage. Rôles PostgreSQL amg_app (moindre privilège) et amg_journal (seul écrivain
  # du journal de sécurité, pool dédié), utilisateur ACL Redis amg_api (sessions, limitation de
  # débit), mots de passe en fichiers propres à chaque environnement. Les secrets sont lus par
  # l'utilisateur de l'image (65532) : fichiers 640, groupe 65532 (EXPLOITATION.md, §11).
  # TRUSTED_PROXY : sous-réseau du réseau d'entrée (celui où Traefik se connecte), seul saut cru pour
  # X-Forwarded-For ; deploy.sh refuse de déployer l'API et watch.sh alerte s'il en diffère
  # (EXPLOITATION.md, §11, « Proxy de confiance »).
  api:
    <<: *hardening
    image: ${API_IMAGE:?API_IMAGE manquant}@${API_DIGEST:?API_DIGEST manquant}
    profiles: [api]
    # Non root imposé, quelle que soit l'image (utilisateur nonroot de l'image distroless).
    user: '65532:65532'
    environment:
      NODE_ENV: production
      AMG_ENV: ${AMG_ENV}
      HOST: 0.0.0.0
      PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: amg
      DB_USER: amg_app
      DB_PASSWORD_FILE: /run/secrets/pg_app_password
      DB_JOURNAL_USER: amg_journal
      DB_JOURNAL_PASSWORD_FILE: /run/secrets/pg_journal_password
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?ADMIN_ORIGIN manquant}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN manquant}
      TRUSTED_PROXY: ${TRUSTED_PROXY:?TRUSTED_PROXY manquant}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_USER: amg_api
      REDIS_PASSWORD_FILE: /run/secrets/redis_api_password
    secrets:
      - pg_app_password
      - pg_journal_password
      - redis_api_password
    # Fichier de drainage de la bascule (/tmp/drain) ; rien d'autre n'est écrit.
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    mem_limit: ${API_MEM_LIMIT:-256m}
    memswap_limit: ${API_MEM_LIMIT:-256m}
    cpus: 1.0
    pids_limit: 128
    # edge : Traefik (entrée seulement) ; data : Postgres et Redis. Tous deux internes : l'API ne
    # parle jamais à Internet.
    networks:
      - edge
      - data
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=${AMG_EDGE_NETWORK}'
      # Forme imposée (watch.sh) : (Host(`admin.…`) || Host(`espace.…`)) && PathPrefix(`/api/`).
      - 'traefik.http.routers.${AMG_PROJECT}-api.rule=${API_RULE:?API_RULE manquant}'
      - 'traefik.http.routers.${AMG_PROJECT}-api.entrypoints=websecure'
      - 'traefik.http.routers.${AMG_PROJECT}-api.tls.certresolver=${AMG_CERTRESOLVER:?AMG_CERTRESOLVER manquant}'
      - 'traefik.http.routers.${AMG_PROJECT}-api.middlewares=${API_MIDDLEWARES:?API_MIDDLEWARES manquant}'
      - 'traefik.http.services.${AMG_PROJECT}-api.loadbalancer.server.port=3000'
      # Middlewares propres au conteneur de l'API (aucune dépendance aux labels du site).
      - 'traefik.http.middlewares.${AMG_PROJECT}-api-retry.retry.attempts=3'
      - 'traefik.http.middlewares.${AMG_PROJECT}-api-retry.retry.initialinterval=100ms'
      # Limitation de débit devant l'API, par adresse du client (critère par défaut de Traefik :
      # l'adresse distante, Traefik recevant directement les connexions) : protège le CPU de l'API
      # et du Traefik partagé avant l'API elle-même (300 requêtes par minute et par IP, ADR-0023).
      # Utilisée en production (API_MIDDLEWARES) ; la préproduction a la sienne (compose.staging.yaml).
      - 'traefik.http.middlewares.${AMG_PROJECT}-api-limit.ratelimit.average=20'
      - 'traefik.http.middlewares.${AMG_PROJECT}-api-limit.ratelimit.period=1s'
      - 'traefik.http.middlewares.${AMG_PROJECT}-api-limit.ratelimit.burst=60'

  # Reportés : worker (CRM 3, lot 5), admin et espace-client (CRM 4-5).
  # Pas d'antivirus : fichiers déposés reconstruits (ADR-0022), budget dans EXPLOITATION.md, 10.

secrets:
  pg_password:
    file: ${AMG_DIR}/secrets/pg_password
  redis_conf:
    file: ${AMG_DIR}/secrets/redis.conf
  # Rôle amg_app de l'API (EXPLOITATION.md, §11). Le secret des migrations (pg_migrator_password)
  # n'est jamais monté ici : seul le conteneur ponctuel des migrations le reçoit (amg_run).
  pg_app_password:
    file: ${AMG_DIR}/secrets/pg_app_password
  # Rôle amg_journal (pool du journal de sécurité de l'API) et utilisateur ACL Redis de l'API
  # (empreinte SHA-256 de ce mot de passe dans redis.conf) : EXPLOITATION.md, §11.
  pg_journal_password:
    file: ${AMG_DIR}/secrets/pg_journal_password
  redis_api_password:
    file: ${AMG_DIR}/secrets/redis_api_password

volumes:
  pgdata:
  # Inutilisé tant que Redis est sans persistance (redis.conf : sessions et compteurs en mémoire) ;
  # gardé pour les files du worker (CRM 3, lot 5), qui décidera de la persistance.
  redisdata:
  # files: (CRM 5) fichiers clients, monté par l'API seule, sauvegardé chaque nuit.

networks:
  # Réseau d'entrée vers Traefik, propre à l'environnement, créé une fois hors Compose
  # (`docker network create --internal`, voir docs/EXPLOITATION.md) : amg_edge_prod / amg_edge_staging.
  # Traefik y est branché par un docker-compose.override.yml dans son dossier ; jamais le réseau du voisin.
  edge:
    external: true
    name: ${AMG_EDGE_NETWORK:?AMG_EDGE_NETWORK manquant}
  # Base et Redis : sans passerelle, jamais joignables depuis Traefik, l'extérieur ou le projet voisin.
  data:
    internal: true
