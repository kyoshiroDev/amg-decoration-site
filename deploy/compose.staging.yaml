# Surcouche de la préproduction : accès protégé (basic auth, empreinte bcrypt dans amg.env),
# limitation de débit par adresse IP (avant l'authentification : freine l'essai de mots de passe et
# protège le CPU du Traefik partagé, bcrypt étant coûteux) et `noindex` sur toutes les réponses.
# Noms préfixés par le projet (`amg-staging-`) : contrôlé par watch.sh.
# Chaque service de compose.yaml est repris ici avec oom_score_adj: 900 (contrôlé par
# deploy/ci/check-budget.sh) : en cas de manque de mémoire, la préproduction est tuée en premier.
services:
  postgres:
    oom_score_adj: 900
  redis:
    oom_score_adj: 900
  site:
    oom_score_adj: 900
    labels:
      # Rafale de 60 : une page de préproduction charge une trentaine de ressources d'un coup ;
      # 10 req/s en continu bornent le coût bcrypt imposé au Traefik partagé.
      - 'traefik.http.middlewares.amg-staging-ratelimit.ratelimit.average=10'
      - 'traefik.http.middlewares.amg-staging-ratelimit.ratelimit.period=1s'
      - 'traefik.http.middlewares.amg-staging-ratelimit.ratelimit.burst=60'
      - 'traefik.http.middlewares.amg-staging-auth.basicauth.users=${STAGING_BASIC_AUTH:?STAGING_BASIC_AUTH manquant}'
      - 'traefik.http.middlewares.amg-staging-auth.basicauth.removeheader=true'
      - 'traefik.http.middlewares.amg-staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow'
