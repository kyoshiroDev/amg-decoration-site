name: CI

# Un seul déclencheur par push : la PR dev → main (CLAUDE.md §8). Déclencher aussi sur `push: dev`
# lançait deux runs identiques par commit (dont deux fois Lighthouse sur 25 pages).
# `workflow_dispatch` permet de relancer à la main, par exemple sans PR ouverte.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache des images optimisées par Astro (AVIF/WebP, ~110 Mo) : sans lui, chaque build régénère
      # les ~2 200 variantes (~6 min en CI). Restauré APRÈS `npm ci`, qui efface `node_modules/`.
      # Clé : dépendances + config Astro + images sources ; `restore-keys` réutilise un cache
      # partiel (Astro indexe chaque variante par son contenu et ses options, rien de périmé n'est servi).
      # `verify` l'écrit, `e2e` le relit (builds `dist/` et `dist-service/`).
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
            astro-img-${{ runner.os }}-
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Tests e2e + accessibilité
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Même cache que le job `verify` (voir plus haut).
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
            astro-img-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Formulaire en mode service (build dist-service/ avec un PUBLIC_FORM_ENDPOINT factice) :
      # lancé même si la suite principale échoue, pour un diagnostic complet.
      - if: success() || failure()
        run: npm run test:e2e:service
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (budgets)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audite exactement le build vérifié par le job `verify` (pas de second build).
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - run: npm run lhci
      # Rapports Lighthouse conservés pour diagnostiquer un échec (pages, métriques, traces).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
          include-hidden-files: true
