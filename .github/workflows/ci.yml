name: CI

# Un seul déclencheur par push : la PR dev → main (CLAUDE.md §8). Déclencher aussi sur `push: dev`
# lançait deux runs identiques par commit (dont deux fois Lighthouse sur 25 pages).
# `workflow_dispatch` permet de relancer à la main, par exemple sans PR ouverte.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lecture seule : aucun job ne publie ni n'écrit dans le dépôt. Actions épinglées par SHA de
# commit (mêmes versions, vérifiées avec `gh api`, que deploy.yml).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Budget mémoire AMG (ADR-0020, docs/EXPLOITATION.md, 10) : pire cas sous le seuil, chaque
  # conteneur dans sa slice, aucun conteneur ponctuel hors de amg_run. Nom du job exigé vert sur le
  # commit installé sur le serveur (EXPLOITATION.md, 3.3) : ne pas le renommer sans mettre la doc à jour.
  budget:
    name: Budget mémoire AMG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docker compose et jq sont fournis par l'image ubuntu-latest ; aucune dépendance npm.
      - run: deploy/ci/check-budget.sh
      # Fenêtre de migration de deploy.sh, liste blanche de amg_run, règles Traefik de watch.sh,
      # liste de restauration : doubles de docker et systemctl, aucun conteneur lancé.
      - name: Tests des scripts du serveur
        run: deploy/ci/test-scripts.sh

  # Site, API (@amg/api) et libs : `npm run verify` construit, contrôle, linte et teste tous les projets
  # Nx (ADR-0023). Les tests de l'API ici sont unitaires et HTTP (app.inject), sans base ; ceux contre
  # un PostgreSQL réel sont dans le job « API (intégration) » ci-dessous.
  verify:
    name: Vérifications (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache des images optimisées par Astro (AVIF/WebP, ~110 Mo) : sans lui, chaque build régénère
      # les ~2 200 variantes (~6 min en CI). Restauré APRÈS `npm ci`, qui efface `node_modules/`.
      # Clé : dépendances + config Astro + images sources ; `restore-keys` réutilise un cache
      # partiel (Astro indexe chaque variante par son contenu et ses options, rien de périmé n'est servi).
      # `verify` l'écrit, `e2e` le relit (builds `apps/site/dist/` et `apps/site/dist-service/`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/node_modules/.astro/assets
          key: astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-${{ hashFiles('apps/site/src/assets/**') }}
          restore-keys: |
            astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-
            astro-img-${{ runner.os }}-
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/site/dist
          retention-days: 3

  # Dépendances installées en production (`npm audit --omit=dev`, ADR-0023) : aucune vulnérabilité
  # élevée ou critique, sauf exception datée et justifiée de .github/audit-exceptions.json (échue :
  # le job échoue). Lit le seul package-lock.json, sans installation.
  audit:
    name: Audit des dépendances de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/audit-production.mjs

  # API contre un PostgreSQL et un Redis réels (CRM 3, lots 1 et 3 ; ADR-0023) : mêmes images, aux
  # mêmes digests, que la production (check-postgres-image.sh, check-redis-image.sh). Rôles créés par libs/api/db/sql/roles.sql,
  # migrations appliquées par `prisma migrate deploy` sous le rôle des migrations, dérive schéma ↔
  # migrations refusée, puis tests d'intégration (droits des rôles, contraintes, journal en ajout
  # seul, consommation atomique) sous le rôle de l'API. Refuse aussi toute modification d'une
  # migration déjà présente sur main.
  api-integration:
    name: API (intégration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          # Identifiants PUBLICS de cette base jetable, propre au job (comme compose.dev.yaml).
          POSTGRES_USER: amg
          POSTGRES_PASSWORD: ci-only-superuser-password-public
          POSTGRES_DB: amg_test
        # Publié sur la boucle locale du runner seulement (jamais sur toutes ses interfaces).
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U amg -d amg_test -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Redis au même digest que la production (check-redis-image.sh) : sessions, limitation de
      # débit ; utilisateur ACL de l'API créé par redis-acl-ci.sh, `default` ensuite désactivé.
      redis:
        image: redis:8.12.0-alpine3.23@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping 2>&1 | grep -qE 'PONG|NOAUTH'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # DB_HOST, DB_PORT et DB_NAME ne sont PAS posées au niveau du job : prisma.config.ts exige alors
    # toutes les variables de connexion (loadCliDatabaseConnection, strict), ce qui ferait échouer
    # `prisma generate` à l'étape de build. Elles sont données aux seules étapes qui parlent à la base.
    env:
      # Mots de passe publics de libs/api/db/sql/dev/passwords.sql (base jetable du job) et
      # superutilisateur du service ci-dessus (tests de ce que lui seul peut faire).
      TEST_DB_APP_PASSWORD: dev-only-amg-app-password-not-secret
      TEST_DB_JOURNAL_PASSWORD: dev-only-amg-journal-password-public
      TEST_DB_MIGRATOR_PASSWORD: dev-only-amg-migrator-password-public
      TEST_DB_SUPERUSER_PASSWORD: ci-only-superuser-password-public
      # Utilisateur ACL Redis de l'API dans le service jetable ci-dessus (mot de passe public).
      TEST_REDIS_USER: amg_api
      TEST_REDIS_PASSWORD: ci-only-redis-password-public-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image PostgreSQL identique à la production
        run: .github/scripts/check-postgres-image.sh
      - name: Image Redis identique à la production
        run: .github/scripts/check-redis-image.sh
      - name: Utilisateur ACL Redis de l'API
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: .github/scripts/redis-acl-ci.sh "$REDIS_CONTAINER" test "$TEST_REDIS_USER" "$TEST_REDIS_PASSWORD"
      # Dépôt public : récupération anonyme de main, sans jeton.
      - name: Migrations déjà fusionnées sur main inchangées
        run: |
          git fetch --no-tags --depth=1 origin main
          .github/scripts/check-migrations-immutable.sh FETCH_HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # roles.sql est atomique (BEGIN … COMMIT dans le fichier) ; passwords.sql ouvre la connexion
      # d'amg_migrator (créé NOLOGIN) comme une fenêtre de migration.
      - name: Rôles PostgreSQL (amg_migrator, amg_app, amg_journal)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i -e PGOPTIONS='-c search_path=pg_catalog,pg_temp' "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U amg -d amg_test < libs/api/db/sql/roles.sql
          docker exec -i -e PGOPTIONS='-c search_path=pg_catalog,pg_temp' "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U amg -d amg_test < libs/api/db/sql/dev/passwords.sql
      - name: Build des libs (client Prisma généré)
        run: npx nx run-many -t build -p @amg/shared-schemas,@amg/api-db --outputStyle=static
      - name: Migrations (rôle des migrations) et absence de dérive
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: amg_test
          DB_USER: amg_migrator
        run: |
          umask 077
          printf '%s' "$TEST_DB_MIGRATOR_PASSWORD" > "$RUNNER_TEMP/pg_migrator_password"
          export DB_PASSWORD_FILE="$RUNNER_TEMP/pg_migrator_password"
          npm run migrate:deploy -w @amg/api-db
          # Rejouer ne fait rien (aucune migration en attente).
          npm run migrate:deploy -w @amg/api-db
          # Base migrée = schema.prisma (code 2 si une migration manque ou diverge).
          npm run migrate:diff -w @amg/api-db
      # Idempotence, et vérification du journal de sécurité migré (fin de roles.sql).
      - name: Rôles rejoués après migration (idempotence, journal conforme)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i -e PGOPTIONS='-c search_path=pg_catalog,pg_temp' "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U amg -d amg_test < libs/api/db/sql/roles.sql
      # npm run (pas nx) : aucune dépendance de cible, donc pas de `prisma generate` avec DB_* partielles.
      - name: Tests d'intégration (rôles de l'API et du journal, Redis)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: amg_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: |
          npm run test:integration -w @amg/api-db
          npm run test:integration -w @amg/api

  e2e:
    name: Tests e2e + accessibilité
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Même cache que le job `verify` (voir plus haut).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/node_modules/.astro/assets
          key: astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-${{ hashFiles('apps/site/src/assets/**') }}
          restore-keys: |
            astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-
            astro-img-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Formulaire en mode service (build dist-service/ avec un PUBLIC_FORM_ENDPOINT factice) :
      # lancé même si la suite principale échoue, pour un diagnostic complet.
      - if: success() || failure()
        run: npm run test:e2e:service
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (budgets)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audite exactement le build vérifié par le job `verify` (pas de second build).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/site/dist
      - run: npm run lhci
      # Rapports Lighthouse conservés pour diagnostiquer un échec (pages, métriques, traces).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/site/.lighthouseci
          retention-days: 7
          include-hidden-files: true
