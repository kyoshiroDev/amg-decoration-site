name: CI

# Un seul déclencheur par push : la PR dev → main (CLAUDE.md §8). Déclencher aussi sur `push: dev`
# lançait deux runs identiques par commit (dont deux fois Lighthouse sur 25 pages).
# `workflow_dispatch` permet de relancer à la main, par exemple sans PR ouverte.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lecture seule : aucun job ne publie ni n'écrit dans le dépôt. Actions épinglées par SHA de
# commit (mêmes versions, vérifiées avec `gh api`, que deploy.yml).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Budget mémoire AMG (ADR-0020, docs/EXPLOITATION.md, 10) : pire cas sous le seuil, chaque
  # conteneur dans sa slice, aucun conteneur ponctuel hors de amg_run. Nom du job exigé vert sur le
  # commit installé sur le serveur (EXPLOITATION.md, 3.3) : ne pas le renommer sans mettre la doc à jour.
  budget:
    name: Budget mémoire AMG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docker compose et jq sont fournis par l'image ubuntu-latest ; aucune dépendance npm.
      - run: deploy/ci/check-budget.sh

  verify:
    name: Vérifications (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache des images optimisées par Astro (AVIF/WebP, ~110 Mo) : sans lui, chaque build régénère
      # les ~2 200 variantes (~6 min en CI). Restauré APRÈS `npm ci`, qui efface `node_modules/`.
      # Clé : dépendances + config Astro + images sources ; `restore-keys` réutilise un cache
      # partiel (Astro indexe chaque variante par son contenu et ses options, rien de périmé n'est servi).
      # `verify` l'écrit, `e2e` le relit (builds `apps/site/dist/` et `apps/site/dist-service/`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/node_modules/.astro/assets
          key: astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-${{ hashFiles('apps/site/src/assets/**') }}
          restore-keys: |
            astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-
            astro-img-${{ runner.os }}-
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/site/dist
          retention-days: 3

  e2e:
    name: Tests e2e + accessibilité
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Même cache que le job `verify` (voir plus haut).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/node_modules/.astro/assets
          key: astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-${{ hashFiles('apps/site/src/assets/**') }}
          restore-keys: |
            astro-img-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/site/astro.config.mjs') }}-
            astro-img-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Formulaire en mode service (build dist-service/ avec un PUBLIC_FORM_ENDPOINT factice) :
      # lancé même si la suite principale échoue, pour un diagnostic complet.
      - if: success() || failure()
        run: npm run test:e2e:service
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (budgets)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audite exactement le build vérifié par le job `verify` (pas de second build).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/site/dist
      - run: npm run lhci
      # Rapports Lighthouse conservés pour diagnostiquer un échec (pages, métriques, traces).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/site/.lighthouseci
          retention-days: 7
          include-hidden-files: true
