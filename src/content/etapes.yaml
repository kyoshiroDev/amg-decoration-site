# Méthode en 6 étapes (accueil « Déroulement de votre projet 3D », docs/contenu-source/accueil.md).
# Titres repris du site actuel ; textes réécrits d'après la source, sans fait ajouté.
prise-de-contact:
  title: 'Prise de contact'
  text: 'Présentez-moi votre projet, vos envies, vos contraintes et votre budget. Je vous envoie ensuite un questionnaire pour bien cerner vos attentes.'
  order: 1
photos-et-devis:
  title: 'Photos et devis'
  text: 'Envoyez-moi des photos de votre pièce, un plan avec ses dimensions et les éléments à conserver. Je vous transmets ensuite un devis personnalisé.'
  order: 2
validation-ambiance:
  title: 'Validation de l’ambiance'
  text: 'Le projet démarre après le paiement. Je crée une planche d’ambiance qui servira de fil conducteur à l’ensemble du projet.'
  order: 3
conception-3d:
  title: 'Aménagement et conception 3D'
  text: 'Je conçois votre projet en 3D : agencement, mobilier et matériaux, pour un résultat harmonieux et fonctionnel.'
  order: 4
modifications:
  title: 'Modifications'
  text: 'Je vous présente une première version du projet. Vous me faites part de vos retours et j’ajuste les rendus selon vos attentes.'
  order: 5
validation-projet:
  title: 'Validation du projet'
  text: 'Vous recevez la version finale au format numérique, en visuels 4K. Votre projet est prêt à être réalisé.'
  order: 6
